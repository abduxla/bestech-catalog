<!--
  Bestech logo.

  Redrawn from the company's own artwork: a red-and-white swoosh mark,
  then "BE" in red and "STECH" in white, with "MACHINES & TOOLS"
  letterspaced underneath.

  The earlier version here was wrong on every count — it used a bull
  head (Bestech's mark is an abstract swoosh, not an animal), it put
  "BE" in a solid red block instead of setting it as red type, and it
  omitted the tagline entirely.

  STILL AN APPROXIMATION. This is traced from a screenshot, so the
  swoosh is close rather than exact. Replace it with the original
  artwork — an SVG, AI or EPS from whoever designed it — and nothing
  else has to change, because every page references this one file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 86" role="img" aria-label="Bestech — Machines &amp; Tools">
  <!-- Mark: a red crescent sweeping up to the right, with a pale
       highlight stroke cutting across it. -->
  <g>
    <path fill="#e01b22"
          d="M14 60 C14 34 34 14 60 14 C50 22 44 31 41 43 C38 55 36 63 26 70 C18 70 14 66 14 60 Z"/>
    <path fill="#e01b22"
          d="M30 72 C40 64 46 54 50 42 C54 30 60 22 70 16 C66 34 60 52 48 66 C42 72 36 74 30 72 Z"/>
    <path fill="#d8dadd"
          d="M58 10 C50 26 44 40 40 54 C37 64 33 70 27 74 C37 74 45 68 50 58 C56 44 60 26 64 10 Z"/>
  </g>

  <!-- Wordmark -->
  <text x="94" y="44"
        font-family="Oswald, 'Arial Narrow', Impact, sans-serif"
        font-size="40" font-weight="700" letter-spacing="0.5">
    <tspan fill="#e01b22">BE</tspan><tspan fill="#ffffff">STECH</tspan>
  </text>

  <text x="96" y="68"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="13.5" font-weight="600" letter-spacing="3.1" fill="#d8dadd">
    MACHINES &amp; TOOLS
  </text>
</svg>
